profile:
  name: "Your Name"
  field: "Bioinformatics"

# +15 pts each (capped at 60 total)
# Tip: include your field AND broader role titles so job boards return results
primary_keywords:
  - "bioinformatics"
  - "computational biology"
  - "research scientist"

# +5 pts each (capped at 20 total)
secondary_keywords:
  - "Python"
  - "machine learning"
  - "data science"
  - "genomics"
  - "PhD"

# Score drops to 0 if any of these match
exclude_keywords:
  - "veterinary"
  - "plant biology"
  - "sales"

# +10 pts bonus if listing country matches
preferred_countries:
  - "Germany"
  - "UK"
  - "Netherlands"
  - "Remote"

phd_settings:
  funded_only: true   # skip unfunded PhD listings

job_settings:
  target_roles:
    - "Bioinformatics Scientist"
    - "Research Scientist"
    - "Computational Biologist"
  experience_levels: ["Entry", "Mid", "Postdoc"]

# Listings below this score are hidden (0–100)
# Lower this if you want more results; raise it to see only strong matches
min_relevance_score: 30
