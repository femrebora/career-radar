# Example search profiles for different fields.
# Copy a block into search_profile.yaml and adjust as needed.

# ── Software Engineering ──────────────────────────────────────────────────────

profile:
  name: "Your Name"
  field: "Software Engineering"

primary_keywords:
  - "software engineer"
  - "backend"
  - "distributed systems"

secondary_keywords:
  - "Go"
  - "Rust"
  - "Kubernetes"
  - "cloud"
  - "microservices"

exclude_keywords:
  - "frontend only"
  - "mobile only"

preferred_countries:
  - "Germany"
  - "Netherlands"
  - "Remote"

phd_settings:
  funded_only: true

job_settings:
  target_roles:
    - "Software Engineer"
    - "Backend Engineer"
    - "Platform Engineer"
  experience_levels: ["Mid", "Senior"]

min_relevance_score: 35

